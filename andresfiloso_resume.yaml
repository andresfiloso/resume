# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.6/schema.json
cv:
  name: Andrés Filoso
  headline: Senior Full Stack Engineer
  location: Barcelona, Spain
  email: andresfilosok@gmail.com
  website: https://andresfiloso.com.ar
  social_networks:
    - network: LinkedIn
      username: afiloso

  sections:
    Professional Summary:
      - Senior Full Stack Engineer with 8+ years of experience building scalable APIs and distributed systems. Strong background in cloud-native architectures, performance optimization, and remote collaboration with U.S.-based stakeholders.

    education:
      - institution: Universidad Nacional de Lanús
        area: Systems Engineering
        degree: B.S. (In Progress)
        start_date: 2014
        end_date: present
        location: Buenos Aires, Argentina

    experience:
      - company: Globant
        position: Sr Backend Engineer
        start_date: 2020-11
        end_date: 2026-03
        location: Remote
        highlights:
          - Architected and scaled RESTful APIs for a large enterprise telecom operator and a major education organization, supporting 10k+ daily active users.
          - Reduced system latency by 25% via k6 load testing, APM profiling, and database optimization.
          - Spearheaded feature delivery across multiple cross-functional teams, consistently meeting release deadlines for major launches.
          - Facilitated technical alignment with U.S. stakeholders, streamlining requirement gathering and improving delivery velocity.

      - company: Activate (Cooperative Startup)
        position: Co-Founder & Lead Full Stack Engineer
        start_date: 2020-05
        end_date: present
        location: Remote
        highlights:
          - Co-founded and served as technical lead, architecting a full-stack digital marketplace from the ground up.
          - Launched activate.ar using Next.js and Node.js, growing the platform to 500+ MAU with high availability.
          - Engineered internal ERP for inventory, logistics, and CRM. Automated spreadsheet workflows, reducing manual processing time by 40%.

      - company: Telecom Argentina
        position: Sr NOC Analyst
        start_date: 2018-04
        end_date: 2020-04
        location: Buenos Aires, Argentina
        highlights:
          - Designed and developed internal tools, scripts, and REST APIs to automate operational workflows and modernize legacy systems still in production.
          - Worked extensively with networking and service infrastructure, including Cisco and Juniper equipment, VLANs, VRF, MPLS, CMTS platforms, DHCP, DNS, and SDH/DWDM links.

    skills:
      - label: Backend & APIs
        details: TypeScript, JavaScript, Node.js, NestJS, Fastify, REST API Design, Strapi CMS
      - label: Databases & Caching
        details: PostgreSQL, MongoDB, Redis
      - label: Frontend
        details: React, Next.js, Tailwind CSS, shadcn/ui, design systems
      - label: Cloud & DevOps
        details: AWS (ECS, ECR, S3), Docker, Terraform, GitHub Actions, CI/CD
      - label: Architecture & Performance
        details: Distributed systems, k6 performance testing, DDD, event-driven architectures
      - label: AI-assisted Development
        details: Claude Code, GitHub Copilot, OpenAI Codex; specs-first workflow for code, tests, and docs
      - label: Languages
        details: Spanish (Native), English (Fluent)

    # interests:
    #   - Travel, Guitar, Knowledge sharing, Mentoring, Collaborative learning communities

design:
  theme: classic

  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(80, 80, 80)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(120, 120, 120)
    top_note: rgb(120, 120, 120)

  typography:
    font_size:
      name: 22pt
      headline: 12pt
      body: 10pt

  sections:
    show_time_spans_in:
      - interests # just to remove time spans from all other sections

  templates:
    footer: ""
    top_note: ""

locale:
  language: english

settings:
  current_date: "2026-04-12"
  render_command:
    typst_path: rendercv_output/andres_filoso_resume.typ
    pdf_path: rendercv_output/andres_filoso_resume.pdf
    markdown_path: rendercv_output/andres_filoso_resume.md
    html_path: rendercv_output/andres_filoso_resume.html
    png_path: rendercv_output/andres_filoso_resume.png
